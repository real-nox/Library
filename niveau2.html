<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Librairie Intelligente | Livres de niveau 2</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-niveau="2">

  <!-- ===== BARRE DE NAVIGATION (identique à l'accueil) ===== -->
  <header class="nav">
    <div class="wrap">
      <a href="index.html" aria-label="Accueil"><img src="images/logo.png" alt="Librairie Intelligente"></a>
      <nav aria-label="Navigation principale">
        <ul>
          <li><a href="cahiers.html">Cahiers</a></li>
          <li><a href="index.html#niveaux" class="active">Livres</a></li>
          <li><a href="index.html#contact">Contactez-nous</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- ===== HERO (même hero, version plus compacte) ===== -->
  <section class="hero hero--small">
    <h1>Librairie Intelligente</h1>
    <div class="ar" lang="ar" dir="rtl">المكتبة الذكية</div>
  </section>

  <main class="wrap">
    <h2 class="page-title">Acheter un livre de niveau 2</h2>

    <!-- ===== CONTENEUR (fond un peu plus clair que la page) ===== -->
    <div class="panel">

      <!-- Outils : filtre par matière + recherche par titre -->
      <div class="tools">
        <select id="matiere" aria-label="Choisir une matière">
          <option value="">Toutes les matières</option>
          <option value="math">Mathématiques</option>
          <option value="ar">Arabe</option>
          <option value="fr">Français</option>
          <option value="svt">Sciences (SVT)</option>
          <option value="ei">Éducation islamique</option>
        </select>
        <div class="search">
          <input id="recherche" type="search" placeholder="Entrez un titre" aria-label="Rechercher un livre par titre">
          <button type="button" aria-label="Rechercher">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6578" stroke-width="2.4" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg>
          </button>
        </div>
      </div>

      <!-- Les cartes de livres sont créées par js/catalogue.js -->
      <div class="books" id="books" aria-live="polite"></div>
    </div>
  </main>

  <!-- ===== PIED DE PAGE ===== -->
  <footer class="footer">&copy; Librairie Intelligente. Tous droits réservés.</footer>

  <script src="js/main.js"></script>
  <script src="js/catalogue.js"></script>
</body>
</html>
