<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Librairie Intelligente | Livres</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="../images/logo.png" type="image/x-icon">
  <!-- Bootstrap d'abord, puis style.css, puis site.css : le style du site garde la priorité -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/site.css">
</head>

<body class="catalogue">

  <!-- ===== BARRE DE NAVIGATION (identique à l'accueil) ===== -->
  <header class="site-nav">
    <nav class="navbar navbar-expand-md wrap py-2" aria-label="Navigation principale">
      <a class="navbar-brand" href="index.html" aria-label="Accueil"><img src="../images/logo.png"
          alt="Librairie Intelligente"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu"
        aria-expanded="false" aria-label="Ouvrir le menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-md-end" id="menu">
        <ul class="navbar-nav gap-2 pt-3 pt-md-0">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="niveau1.html">Livres</a></li>
          <li class="nav-item"><a class="nav-link" href="cahiers.html">Papeterie</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#imprimer">Imprimer</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#contact">Contact</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <!-- ===== HERO (même hero, version plus compacte) ===== -->
  <section class="hero hero--small hero--books">
    <h1>Librairie Intelligente</h1>
    <div class="ar" lang="ar" dir="rtl">المكتبة الذكية</div>
  </section>

  <main class="wrap">
    <h2 class="page-title">Acheter un livre</h2>

    <!-- ===== CONTENEUR (fond un peu plus clair que la page) ===== -->
    <div class="panel">

      <!-- Outils : filtre + recherche par titre (ids utilisés par le JavaScript : ne pas changer) -->
      <div class="tools">
        <select id="matiere" aria-label="Choisir une matière">
          const MATIERES = {
  math: 'Mathematiques',
  ar:   'Arabe',
  fr:   'Français',
  svt:  'Eveil Scientifique',
  ei:   'Education Islamique',
  eng: 'Anglais',
  info: 'Informatique',
  ss: 'Science sociales'
};

          <option value="">Toutes les matières</option>
          <option value="math">Mathématiques</option>
          <option value="ar">Arabe</option>
          <option value="fr">Français</option>
          <option value="svt">Eveil Scientifique</option>
          <option value="ei">Éducation islamique</option>
          <option value="eng">Anglais</option>
          <option value="info">Informatique</option>
          <option value="ss">Science sociales</option>
        </select>
        <div class="search">
          <input id="recherche" type="search" placeholder="Entrez un titre" aria-label="Rechercher un livre par titre">
          <button type="button" aria-label="Rechercher">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6578" stroke-width="2.4"
              stroke-linecap="round">
              <circle cx="10" cy="10" r="6.5" />
              <path d="M15 15l6 6" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Les cartes de livres sont créées par js/niveau1.js -->
      <div class="books" id="books" aria-live="polite"></div>
    </div>
  </main>

  <!-- ===== PIED DE PAGE ===== -->
  <footer class="footer">&copy; Librairie Intelligente. Tous droits réservés.</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/apiConfig.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/niveau1.js"></script>
</body>

</html>
